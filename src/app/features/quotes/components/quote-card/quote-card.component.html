<p-card class="quote-card">
  <blockquote class="quote-card__text">«{{ quote().quote }}»</blockquote>

  <p class="quote-card__author">— {{ quote().author }}</p>

  @if (quote().isFavorite) {
    <p-button
      [attr.id]="'quote-favorite-button-' + quote().id"
      label="★ В избранном"
      severity="secondary"
      (onClick)="onFavoriteToggle()"
    ></p-button>
  } @else {
    <p-button
      [attr.id]="'quote-favorite-button-' + quote().id"
      label="☆ Добавить в избранное"
      (onClick)="onFavoriteToggle()"
    ></p-button>
  }
</p-card>
