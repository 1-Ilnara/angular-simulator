<div class="card flex justify-content-center">
  <form
    [formGroup]="form"
    (ngsubmit)="onSubmit()"
    class="flex flex-column gap-3"
    style="width: 500px"
  >
    <h2>Создать новый пост</h2>

    <div class="flex flex-column gap-1">
      <label for="title">Заголовок</label>
      <input pinputtext id="title" formcontrolname="title" />
    </div>

    <div class="flex flex-column gap-1">
      <label for="body">Содержание</label>
      <textarea pinputtextarea id="body" formcontrolname="body" rows="5"></textarea>
    </div>

    <div class="flex flex-column gap-1">
      <label for="tags">Теги (через запятую)</label>
      <input pinputtext id="tags" formcontrolname="tags" />
    </div>

    <div class="flex gap-2">
      <div class="flex flex-column gap-1 flex-1">
        <label for="userId">User ID</label>
        <p-inputnumber id="userId" formcontrolname="userId"></p-inputnumber>
      </div>
      <div class="flex flex-column gap-1 flex-1">
        <label for="views">Просмотры</label>
        <p-inputnumber id="views" formcontrolname="views"></p-inputnumber>
      </div>
    </div>

    <div class="flex gap-2">
      <div class="flex flex-column gap-1 flex-1">
        <label for="likes">Лайки</label>
        <p-inputnumber id="likes" formcontrolname="likes"></p-inputnumber>
      </div>
      <div class="flex flex-column gap-1 flex-1">
        <label for="dislikes">Дизлайки</label>
        <p-inputnumber id="dislikes" formcontrolname="dislikes"></p-inputnumber>
      </div>
    </div>

    <button pbutton type="submit" [disabled]="form.invalid">Создать пост</button>
  </form>
</div>
