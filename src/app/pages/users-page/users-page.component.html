<div class="users-container">
  <h1>Список Пользователей</h1>

  <app-user-create (createUser)="onCreateUser($event)"></app-user-create>

  <app-users-filter (filterChange)="onFilterChange($event)"></app-users-filter>

  <div class="grid">
    @for (user of filteredUsers$ | async; track user.id) {
      <app-user-card
        [user]="user"
        (deleteUser)="onDeleteUser($event)">
      </app-user-card>
    } @empty {
      <div class="empty">Нет пользователей для отображения</div>
    }
  </div>
</div>
