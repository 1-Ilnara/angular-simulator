<form id="create-user-form" [formGroup]="userForm" (ngSubmit)="onSubmit()" class="create-form">
  <h2>Создать пользователя</h2>

  <div class="form-section">
    <h3>Основное</h3>
    <input
      id="input-name"
      type="text"
      formcontrolname="name"
      placeholder="Имя *"
      appanimatedgradient
    />
    <input
      id="input-username"
      type="text"
      formcontrolname="username"
      placeholder="Никнейм *"
      appanimatedgradient
    />
    <input
      id="input-email"
      type="email"
      formcontrolname="email"
      placeholder="Email *"
      appanimatedgradient
    />
    <input
      id="input-phone"
      type="text"
      formcontrolname="phone"
      placeholder="Телефон *"
      appanimatedgradient
    />
    <input
      id="input-website"
      type="text"
      formcontrolname="website"
      placeholder="Веб-сайт"
      appanimatedgradient
    />
  </div>

  <div class="form-section" formGroupName="address">
    <h3>Адрес</h3>
    <input
      id="input-city"
      type="text"
      formcontrolname="city"
      placeholder="Город *"
      appanimatedgradient
    />
    <input
      id="input-street"
      type="text"
      formcontrolname="street"
      placeholder="Улица *"
      appanimatedgradient
    />
    <input
      id="input-suite"
      type="text"
      formcontrolname="suite"
      placeholder="Офис/Квартира"
      appanimatedgradient
    />
    <input
      id="input-zipcode"
      type="text"
      formcontrolname="zipcode"
      placeholder="Индекс *"
      appanimatedgradient
    />

    <div formGroupName="geo" class="geo-inputs">
      <input
        id="input-geo-lat"
        type="text"
        formcontrolname="lat"
        placeholder="Широта (lat) *"
        appanimatedgradient
      />
      <input
        id="input-geo-lng"
        type="text"
        formcontrolname="lng"
        placeholder="Долгота (lng) *"
        appanimatedgradient
      />
    </div>
  </div>

  <div class="form-section" formgroupname="company">
    <h3>Компания</h3>
    <input
      id="input-company-name"
      type="text"
      formcontrolname="name"
      placeholder="Название компании *"
      appanimatedgradient
    />
    <input
      id="input-company-phrase"
      type="text"
      formcontrolname="catchPhrase"
      placeholder="Слоган"
      appanimatedgradient
    />
    <input
      id="input-company-bs"
      type="text"
      formcontrolname="bs"
      placeholder="Специализация"
      appanimatedgradient
    />
  </div>

  <button id="btn-submit-user" type="submit" appHoverBold [disabled]="userForm.invalid">
    Создать пользователя
  </button>
</form>
