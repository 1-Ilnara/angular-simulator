<form id="create-user-form" [formGroup]="userForm" (ngSubmit)="onSubmit()" class="create-form">
  <h2>Создать пользователя</h2>

  <div class="form-section">
    <h3>Основное</h3>
    <input id="input-name" type="text" formControlName="name" placeholder="Имя *" />
    <input id="input-username" type="text" formControlName="username" placeholder="Никнейм *" />
    <input id="input-email" type="email" formControlName="email" placeholder="Email *" />
    <input id="input-phone" type="text" formControlName="phone" placeholder="Телефон *" />
    <input id="input-website" type="text" formControlName="website" placeholder="Веб-сайт" />
  </div>

  <div class="form-section" formGroupName="address">
    <h3>Адрес</h3>
    <input id="input-city" type="text" formControlName="city" placeholder="Город *" />
    <input id="input-street" type="text" formControlName="street" placeholder="Улица *" />
    <input id="input-suite" type="text" formControlName="suite" placeholder="Офис/Квартира" />
    <input id="input-zipcode" type="text" formControlName="zipcode" placeholder="Индекс *" />

    <div formGroupName="geo" class="geo-inputs">
      <input id="input-geo-lat" type="text" formControlName="lat" placeholder="Широта (lat) *" />
      <input id="input-geo-lng" type="text" formControlName="lng" placeholder="Долгота (lng) *" />
    </div>
  </div>

  <div class="form-section" formGroupName="company">
    <h3>Компания</h3>
    <input id="input-company-name" type="text" formControlName="name" placeholder="Название компании *" />
    <input id="input-company-phrase" type="text" formControlName="catchPhrase" placeholder="Слоган" />
    <input id="input-company-bs" type="text" formControlName="bs" placeholder="Специализация" />
  </div>

  <button id="btn-submit-user" type="submit" [disabled]="userForm.invalid">
    Создать пользователя
  </button>
</form>
