<div class="message-container">
  @for (message of messageService.messages; track message.id) {
    <div class="message-toast" [ngClass]="message.type">
      <div class="toast-icon-box">
        <img
          src="Images/svg/message_icon.svg"
          alt="Message icon"
          class="toast-icon"
        />
      </div>

      <div class="toast-content">
        <h4 class="toast-title">{{ message.title }}</h4>
        <p class="toast-text">{{ message.text }}</p>
      </div>

      <button
        [id]="'toast-close-button-' + message.id"
        class="toast-close-btn"
        (click)="handleCloseMessage(message.id)"
        aria-label="Закрыть сообщение"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
      </button>
    </div>
  }
</div>
