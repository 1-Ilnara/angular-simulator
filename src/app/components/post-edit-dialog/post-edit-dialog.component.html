<form [formGroup]="form" (ngSubmit)="onSave()" class="flex flex-column gap-3">
  <div class="flex flex-column gap-1">
    <label for="post-title-input">Заголовок</label>
    <input pInputText id="post-title-input" formControlName="title" />
  </div>

  <div class="flex flex-column gap-1">
    <label for="post-tags-input">Теги (через запятую)</label>
    <input pInputText id="post-tags-input" formControlName="tags" />
  </div>

  <div class="flex flex-column gap-1">
    <label for="post-views-input">Просмотры</label>
    <p-inputNumber id="post-views-input" formControlName="views" min="0"></p-inputNumber>
  </div>

  <div class="flex justify-content-end gap-2 mt-3">
    <p-button
      id="cancel-edit-post-button"
      label="Отмена"
      severity="secondary"
      (click)="closeDialog()"
    ></p-button>

    <p-button
      id="save-edit-post-button"
      label="Сохранить"
      type="submit"
      [disabled]="form.invalid"
    ></p-button>
  </div>
</form>
